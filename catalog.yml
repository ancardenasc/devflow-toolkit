# Single source of truth for the asset catalog. README tables and the
# Claude marketplace are generated from this file (scripts/build.py).
repo: ancardenasc/devflow-toolkit
version: 0.1.0
author: { name: Nicolas Cardenas, url: https://github.com/ancardenasc }
license: MIT
description: Skills, agents and prompts for Claude Code and GitHub Copilot that take a task from ticket to merge.

bundles:
  devflow-core:
    description: Ticket-to-merge workflow - start, implement, commit and ship a task.
    description_es: Flujo ticket-a-merge - iniciar, implementar, commitear y entregar una tarea.
  devflow-review:
    description: Read-only reviewers - correctness and security, clean code, UX and accessibility.
    description_es: Revisores de solo lectura - correccion y seguridad, codigo limpio, UX y accesibilidad.
  devflow-portfolio:
    description: Scaffold a UX/engineering case-study portfolio repository.
    description_es: Estructura un repositorio de portafolio con casos de estudio UX/ingenieria.

# assets: id must equal the file/folder name under src/.
# type: skill | agent | prompt | hook
assets:
  - id: commit
    type: skill
    bundle: devflow-core
    description: Conventional or ticket-prefixed commits from the staged diff, with confirmation and a batch mode for other skills.
    description_es: Commits convencionales o con prefijo de ticket a partir del diff, con confirmacion y modo batch para otros skills.
  - id: session-title
    type: hook
    bundle: devflow-core
    description: Names each new Claude Code session after the git branch (Claude Code only).
    description_es: Nombra cada sesion nueva de Claude Code con la rama git (solo Claude Code).
  - id: unit-test-writer
    type: agent
    bundle: devflow-core
    description: Writes unit tests (Jest/Vitest + Testing Library or Vue Test Utils) for behavior, with a11y checks and a red/green TDD flow.
    description_es: Escribe unit tests (Jest/Vitest + Testing Library o Vue Test Utils) de comportamiento, con a11y y flujo TDD rojo/verde.
  - id: case-kit
    type: skill
    bundle: devflow-portfolio
    description: Scaffolds a 10-phase portfolio case-study repo (brief, research, PRD, design, testing, accessibility, case study).
    description_es: Genera un repo de caso de estudio de portafolio en 10 fases (brief, investigacion, PRD, diseno, pruebas, accesibilidad, caso).
  - id: code-review
    type: agent
    bundle: devflow-review
    description: Read-only review of correctness, OWASP security, performance, SOLID and error handling on a PR/MR or local diff.
    description_es: Revision de solo lectura de correccion, seguridad OWASP, performance, SOLID y manejo de errores sobre un PR/MR o diff local.
  - id: code-clean
    type: agent
    bundle: devflow-review
    description: Read-only Clean Code gate - naming, functions, duplication, dead code, F.I.R.S.T tests and measured metrics.
    description_es: Gate de Clean Code de solo lectura - nombres, funciones, duplicacion, codigo muerto, tests F.I.R.S.T y metricas medidas.
  - id: ux-review
    type: agent
    bundle: devflow-review
    description: Read-only UX/accessibility review on frontend changes - WCAG 2.2 AA, Nielsen heuristics, equitable design.
    description_es: Revision UX/accesibilidad de solo lectura en cambios frontend - WCAG 2.2 AA, heuristicas de Nielsen, diseno equitativo.
